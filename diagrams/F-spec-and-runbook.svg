<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t { fill: #1f2328; }
    .m { fill: #5b6472; }
    .h { font-size: 20px; font-weight: 600; }
    .s { font-size: 13px; }
    .xs { font-size: 11.5px; }
    .xxs { font-size: 10.5px; }
    .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; }
    .card { fill: #ffffff; stroke: #cfd6e0; stroke-width: 1; rx: 6; }
  </style>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6472"/>
    </marker>
    <marker id="arwS" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="#5b6472"/>
    </marker>
    <marker id="arwP" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6d5bd0"/>
    </marker>
  </defs>

  <rect width="1000" height="900" fill="#ffffff"/>
  <text x="40" y="46" class="t h">F — Specification and runbook</text>
  <text x="40" y="70" class="m s">Two peer documents in one layer. Neither is generated from the other — the runbook is the procedure that reads the spec.</text>

  <!-- the design-spec layer -->
  <rect x="40" y="96" width="920" height="350" rx="8" fill="#f4f2fd" stroke="#6d5bd0" stroke-width="2"/>
  <rect x="40" y="96" width="8" height="350" rx="4" fill="#6d5bd0"/>
  <text x="68" y="126" class="t" font-size="17" font-weight="600">design-spec/ — one document set, one version</text>
  <text x="68" y="147" class="m xs">Both human-authored. Both change only through a Proceed-gated spec edit. Layer 1 of the pipeline in diagram A.</text>

  <!-- specification card -->
  <rect x="68" y="166" width="380" height="196" class="card"/>
  <text x="86" y="196" class="t" font-size="17" font-weight="600">Specification</text>
  <text x="86" y="216" class="m xs">openaos-design-specification.md · §1–§32</text>
  <line x1="86" y1="228" x2="430" y2="228" stroke="#e4e8ee"/>
  <text x="86" y="250" class="t s" font-weight="600">What the system is</text>
  <text x="86" y="270" class="m xs">Frame — goal, guiding principle, core model</text>
  <text x="86" y="288" class="m xs">§3 safety and approval · §7B builder specs</text>
  <text x="86" y="306" class="m xs">§8.1, §12, §13 — the prose the three skills are</text>
  <text x="86" y="324" class="m xs">authored from · §14.8 drift invariant</text>
  <text x="86" y="342" class="m xs">§16 schemas · §17 governance · §18 templates · §28 layout</text>

  <!-- coupling between the two cards -->
  <line x1="456" y1="240" x2="544" y2="240" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)" marker-start="url(#arwS)"/>
  <text x="500" y="272" class="t xs" text-anchor="middle" font-weight="600">continuous</text>
  <text x="500" y="288" class="t xs" text-anchor="middle" font-weight="600">section</text>
  <text x="500" y="304" class="t xs" text-anchor="middle" font-weight="600">numbering</text>
  <text x="500" y="324" class="m xxs" text-anchor="middle">both ways</text>

  <!-- runbook card -->
  <rect x="552" y="166" width="380" height="196" class="card"/>
  <text x="570" y="196" class="t" font-size="17" font-weight="600">Runbook</text>
  <text x="570" y="216" class="m xs">openaos-packaging-runbook.md · §33–§37</text>
  <line x1="570" y1="228" x2="914" y2="228" stroke="#e4e8ee"/>
  <text x="570" y="250" class="t s" font-weight="600">How to verify it and ship it</text>
  <text x="570" y="270" class="m xs">§33 design governance rules · §33.1 design tenets</text>
  <text x="570" y="288" class="m xs">§34 readiness checklist · §35 generation scope</text>
  <text x="570" y="306" class="m xs">§36.1 readiness review · §36.2 plugin generation</text>
  <text x="570" y="324" class="m xs">§36.3 spec sync (plugin → spec)</text>
  <text x="570" y="342" class="m xs">§37 release steps</text>

  <!-- shared stamp band -->
  <rect x="68" y="376" width="864" height="54" class="card"/>
  <text x="86" y="400" class="t xs" font-weight="600">Stamped identically —</text>
  <text x="268" y="400" class="m xs">openaos_version: 3.2.0 · status: design_ready_for_generation · one version fact across the whole set</text>
  <text x="86" y="420" class="m xxs">The set includes sync-exclusions.md, the tracked record of tenet-check exclusions that §36.3 appends to and §34 reads.</text>

  <!-- what the runbook points at -->
  <rect x="40" y="468" width="560" height="238" rx="6" fill="#f7f8fa" stroke="#cfd6e0"/>
  <text x="56" y="492" class="t s" font-weight="600">The runbook points at the spec</text>
  <text x="56" y="510" class="m xxs">Every checklist item and every generation source names a section or a script.</text>
  <text x="56" y="536" class="m xs">§34 · safety and approval complete</text>
  <text x="424" y="536" class="t xs" font-weight="600">→ §3, §16.1</text>
  <text x="56" y="558" class="m xs">§34 · five governance workflows defined</text>
  <text x="424" y="558" class="t xs" font-weight="600">→ §17 + catalog</text>
  <text x="56" y="580" class="m xs">§34 · builder specs follow the contract</text>
  <text x="424" y="580" class="t xs" font-weight="600">→ §7B.1</text>
  <text x="56" y="602" class="m xs">§34 · build and refine match the invariant</text>
  <text x="424" y="602" class="t xs" font-weight="600">→ §12, §13, §14.8</text>
  <text x="56" y="624" class="m xs">§34 · no unreflected edits in plugin skills/</text>
  <text x="424" y="624" class="t xs" font-weight="600">→ sync-state.py</text>
  <text x="56" y="646" class="m xs">§34 · every exclusion carries a disposition</text>
  <text x="424" y="646" class="t xs" font-weight="600">→ sync-exclusions.md</text>
  <text x="56" y="668" class="m xs">§35 · the three SKILL.md files</text>
  <text x="424" y="668" class="t xs" font-weight="600">→ §8.1, §12, §13</text>
  <text x="56" y="690" class="m xs">§35 · content/ and workflow-specs/</text>
  <text x="424" y="690" class="t xs" font-weight="600">→ verbatim, both ways</text>

  <!-- and the spec scopes the review -->
  <rect x="620" y="468" width="340" height="238" rx="6" fill="#faf9fe" stroke="#6d5bd0"/>
  <text x="636" y="492" class="t s" font-weight="600">…and the spec scopes the review</text>
  <line x1="636" y1="510" x2="836" y2="510" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwP)"/>
  <text x="636" y="538" class="m xs">A change to a spec section decides which</text>
  <text x="636" y="556" class="m xs">§34 items the next review must re-check:</text>
  <text x="636" y="582" class="t xs" font-weight="600">full</text>
  <text x="676" y="582" class="m xs">— every §34 item.</text>
  <text x="636" y="604" class="t xs" font-weight="600">incremental</text>
  <text x="722" y="604" class="m xs">— only the items whose</text>
  <text x="636" y="622" class="m xs">sections changed since the last review's</text>
  <text x="636" y="640" class="m xs">baseline version, per git diff.</text>
  <text x="636" y="668" class="m xxs">The six mechanical validators are exempt —</text>
  <text x="636" y="686" class="m xxs">they always run in full, whichever mode.</text>

  <!-- the review loop -->
  <text x="40" y="736" class="t s" font-weight="600">Where the two documents meet — the §36 loop</text>
  <rect x="40" y="748" width="135" height="66" rx="6" fill="#faf9fe" stroke="#6d5bd0" stroke-dasharray="5 4"/>
  <text x="107" y="770" class="t" font-size="11" text-anchor="middle" font-weight="600">§36.3 spec sync</text>
  <text x="107" y="786" class="m" font-size="9.5" text-anchor="middle">only if a plugin</text>
  <text x="107" y="799" class="m" font-size="9.5" text-anchor="middle">file was hand-edited</text>
  <line x1="177" y1="781" x2="195" y2="781" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="197" y="748" width="135" height="66" rx="6" fill="#f4f2fd" stroke="#6d5bd0"/>
  <text x="264" y="774" class="t" font-size="11" text-anchor="middle" font-weight="600">§36.1 review</text>
  <text x="264" y="792" class="m" font-size="9.5" text-anchor="middle">reads the spec</text>
  <line x1="334" y1="781" x2="352" y2="781" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="354" y="748" width="135" height="66" rx="6" class="card"/>
  <text x="421" y="774" class="t" font-size="11" text-anchor="middle" font-weight="600">one issue list</text>
  <text x="421" y="792" class="m" font-size="9.5" text-anchor="middle">gates finalization</text>
  <line x1="491" y1="781" x2="509" y2="781" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="511" y="748" width="135" height="66" rx="6" fill="#fdf6e7" stroke="#d99a2b"/>
  <text x="578" y="770" class="t" font-size="11" text-anchor="middle" font-weight="600">spec edit · Proceed</text>
  <text x="578" y="786" class="m" font-size="9.5" text-anchor="middle">each finding,</text>
  <text x="578" y="799" class="m" font-size="9.5" text-anchor="middle">separately gated</text>
  <line x1="648" y1="781" x2="666" y2="781" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="668" y="748" width="135" height="66" rx="6" fill="#f4f2fd" stroke="#6d5bd0"/>
  <text x="735" y="774" class="t" font-size="11" text-anchor="middle" font-weight="600">version increments</text>
  <text x="735" y="792" class="m" font-size="9.5" text-anchor="middle">here, and only here</text>
  <line x1="805" y1="781" x2="823" y2="781" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="825" y="748" width="135" height="66" rx="6" fill="#eefaf9" stroke="#1a9c96"/>
  <text x="892" y="770" class="t" font-size="11" text-anchor="middle" font-weight="600">§36.2 → the plugin</text>
  <text x="892" y="786" class="m" font-size="9.5" text-anchor="middle">packages a version,</text>
  <text x="892" y="799" class="m" font-size="9.5" text-anchor="middle">never creates one</text>

  <path d="M578,818 L578,832 L264,832 L264,820" fill="none" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <rect x="342" y="821" width="158" height="14" fill="#ffffff"/>
  <text x="421" y="832" class="m xxs" text-anchor="middle" fill="#5b6472">repeat until the list is clean</text>

  <text x="40" y="858" class="m xs">Ordering rule (§33): within any cycle, §36.3 runs before §36.2. The two directions are never concurrently live, so there is nothing to reconcile.</text>
  <text x="40" y="880" class="m xs">The spec says what the system is; the runbook says how to check it and ship it. Behaviour starts in the spec, procedure in the runbook.</text>
</svg>
