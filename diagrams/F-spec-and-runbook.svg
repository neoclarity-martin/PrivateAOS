<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t { fill: #1f2328; }
    .m { fill: #5b6472; }
    .h { font-size: 20px; font-weight: 600; }
    .s { font-size: 13px; }
    .xs { font-size: 11.5px; }
    .xxs { font-size: 10.5px; }
    .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; }
    .card { fill: #ffffff; stroke: #cfd6e0; stroke-width: 1; rx: 6; }
  </style>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6472"/>
    </marker>
    <marker id="arwS" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="#5b6472"/>
    </marker>
    <marker id="arwP" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6d5bd0"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#ffffff"/>
  <text x="40" y="46" class="t h">F — Specification and runbook</text>
  <text x="40" y="70" class="m s">Two peer documents in one layer. Neither is generated from the other — the runbook is the procedure that reads the spec.</text>

  <!-- the design-spec layer -->
  <rect x="40" y="96" width="920" height="310" rx="8" fill="#f4f2fd" stroke="#6d5bd0" stroke-width="2"/>
  <rect x="40" y="96" width="8" height="310" rx="4" fill="#6d5bd0"/>
  <text x="68" y="126" class="t" font-size="17" font-weight="600">design-spec/ — one document set, one version</text>
  <text x="68" y="147" class="m xs">Both human-authored. Both change only through a Proceed-gated spec edit. Layer 1 of the pipeline in diagram A.</text>

  <!-- specification card -->
  <rect x="68" y="166" width="380" height="170" class="card"/>
  <text x="86" y="196" class="t" font-size="17" font-weight="600">Specification</text>
  <text x="86" y="216" class="m xs">openaos-design-specification.md · §1–§32</text>
  <line x1="86" y1="228" x2="430" y2="228" stroke="#e4e8ee"/>
  <text x="86" y="250" class="t s" font-weight="600">What the system is</text>
  <text x="86" y="270" class="m xs">Frame — goal, guiding principle, core model</text>
  <text x="86" y="288" class="m xs">§3 safety and approval · §7B builder specs</text>
  <text x="86" y="306" class="m xs">§12–§13 engines · §14.8 drift invariant</text>
  <text x="86" y="324" class="m xs">§16 schemas · §17 governance · §18 templates · §28 layout</text>

  <!-- coupling between the two cards -->
  <line x1="456" y1="240" x2="544" y2="240" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)" marker-start="url(#arwS)"/>
  <text x="500" y="272" class="t xs" text-anchor="middle" font-weight="600">continuous</text>
  <text x="500" y="288" class="t xs" text-anchor="middle" font-weight="600">section</text>
  <text x="500" y="304" class="t xs" text-anchor="middle" font-weight="600">numbering</text>
  <text x="500" y="324" class="m xxs" text-anchor="middle">both ways</text>

  <!-- runbook card -->
  <rect x="552" y="166" width="380" height="170" class="card"/>
  <text x="570" y="196" class="t" font-size="17" font-weight="600">Runbook</text>
  <text x="570" y="216" class="m xs">openaos-packaging-runbook.md · §33–§37</text>
  <line x1="570" y1="228" x2="914" y2="228" stroke="#e4e8ee"/>
  <text x="570" y="250" class="t s" font-weight="600">How to verify it and ship it</text>
  <text x="570" y="270" class="m xs">§33 design governance rules</text>
  <text x="570" y="288" class="m xs">§34 readiness checklist · §35 generation scope</text>
  <text x="570" y="306" class="m xs">§36.1 readiness review · §36.2 plugin generation</text>
  <text x="570" y="324" class="m xs">§37 release steps</text>

  <!-- shared stamp band -->
  <rect x="68" y="346" width="864" height="44" class="card"/>
  <text x="86" y="373" class="t xs" font-weight="600">Stamped identically —</text>
  <text x="268" y="373" class="m xs">openaos_version: 3.1.0 · status: design_ready_for_generation · one version fact across the whole set</text>

  <!-- what the runbook points at -->
  <rect x="40" y="428" width="560" height="184" rx="6" fill="#f7f8fa" stroke="#cfd6e0"/>
  <text x="56" y="452" class="t s" font-weight="600">The runbook points at the spec</text>
  <text x="56" y="470" class="m xxs">Every checklist item and every generation source names a section.</text>
  <text x="56" y="496" class="m xs">§34 · safety and approval complete</text>
  <text x="440" y="496" class="t xs" font-weight="600">→ §3, §16.1</text>
  <text x="56" y="518" class="m xs">§34 · five governance workflows defined</text>
  <text x="440" y="518" class="t xs" font-weight="600">→ §17 + catalog</text>
  <text x="56" y="540" class="m xs">§34 · builder specs follow the contract</text>
  <text x="440" y="540" class="t xs" font-weight="600">→ §7B.1</text>
  <text x="56" y="562" class="m xs">§34 · build and refine match the invariant</text>
  <text x="440" y="562" class="t xs" font-weight="600">→ §12, §13, §14.8</text>
  <text x="56" y="584" class="m xs">§35 · the three SKILL.md files</text>
  <text x="440" y="584" class="t xs" font-weight="600">→ §8.1, §12, §13</text>
  <text x="56" y="606" class="m xs">§35 · content/ and workflow-specs/</text>
  <text x="440" y="606" class="t xs" font-weight="600">→ copied verbatim</text>

  <!-- and the spec scopes the review -->
  <rect x="620" y="428" width="340" height="184" rx="6" fill="#faf9fe" stroke="#6d5bd0"/>
  <text x="636" y="452" class="t s" font-weight="600">…and the spec scopes the review</text>
  <line x1="636" y1="470" x2="836" y2="470" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwP)"/>
  <text x="636" y="498" class="m xs">A change to a spec section decides which</text>
  <text x="636" y="516" class="m xs">§34 items the next review must re-check:</text>
  <text x="636" y="542" class="t xs" font-weight="600">full</text>
  <text x="676" y="542" class="m xs">— every §34 item.</text>
  <text x="636" y="564" class="t xs" font-weight="600">incremental</text>
  <text x="722" y="564" class="m xs">— only the items whose</text>
  <text x="636" y="582" class="m xs">sections changed since the last review's</text>
  <text x="636" y="600" class="m xs">baseline version, per git diff.</text>

  <!-- the review loop -->
  <text x="40" y="644" class="t s" font-weight="600">Where the two documents meet — the §36 loop</text>
  <rect x="40" y="656" width="150" height="60" rx="6" fill="#f4f2fd" stroke="#6d5bd0"/>
  <text x="115" y="682" class="t xs" text-anchor="middle" font-weight="600">§36.1 review</text>
  <text x="115" y="700" class="m xxs" text-anchor="middle">reads the spec</text>
  <line x1="192" y1="686" x2="212" y2="686" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="214" y="656" width="170" height="60" rx="6" class="card"/>
  <text x="299" y="682" class="t xs" text-anchor="middle" font-weight="600">one issue list</text>
  <text x="299" y="700" class="m xxs" text-anchor="middle">gates finalization</text>
  <line x1="386" y1="686" x2="406" y2="686" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="408" y="656" width="170" height="60" rx="6" fill="#fdf6e7" stroke="#d99a2b"/>
  <text x="493" y="682" class="t xs" text-anchor="middle" font-weight="600">spec edit · Proceed</text>
  <text x="493" y="700" class="m xxs" text-anchor="middle">each finding, separately gated</text>
  <line x1="580" y1="686" x2="600" y2="686" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="602" y="656" width="150" height="60" rx="6" fill="#f4f2fd" stroke="#6d5bd0"/>
  <text x="677" y="682" class="t xs" text-anchor="middle" font-weight="600">version increments</text>
  <text x="677" y="700" class="m xxs" text-anchor="middle">here, and only here</text>
  <line x1="754" y1="686" x2="774" y2="686" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="776" y="656" width="184" height="60" rx="6" fill="#eefaf9" stroke="#1a9c96"/>
  <text x="868" y="678" class="t xs" text-anchor="middle" font-weight="600">§36.2 → the plugin</text>
  <text x="868" y="695" class="m xxs" text-anchor="middle">packages a version,</text>
  <text x="868" y="708" class="m xxs" text-anchor="middle">never creates one</text>

  <path d="M493,720 L493,736 L115,736 L115,722" fill="none" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="304" y="732" class="m xxs" text-anchor="middle" fill="#5b6472">repeat steps 2–4 until the list is clean</text>

  <text x="40" y="766" class="m xs">The spec says what the system is; the runbook says how to check it and ship it. Editing behaviour starts in the spec — editing the procedure starts in the runbook.</text>
</svg>
