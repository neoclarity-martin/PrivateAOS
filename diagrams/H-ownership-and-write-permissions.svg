<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 940" width="1060" height="940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t { fill: #1f2328; }
    .m { fill: #5b6472; }
    .s { font-size: 13px; }
    .xs { font-size: 11.5px; }
    .xxs { font-size: 10.5px; }
    .mono { font-family: Consolas, monospace; font-size: 11px; }
    .hd { font-size: 11px; font-weight: 600; fill: #5b6472; letter-spacing: .06em; }
  </style>
  <rect width="1060" height="940" fill="#ffffff"/>
  <text x="40" y="46" class="t" font-size="20" font-weight="600">H — Who may write what</text>
  <text x="40" y="70" class="m s">Read against the drift invariant: definition files change only through a gated path, data files accumulate and are never overwritten.</text>

  <!-- matrix -->
  <g class="hd" text-anchor="middle">
    <text x="470" y="112">setup-openaos</text>
    <text x="610" y="112">build-workflow</text>
    <text x="750" y="112">refine-workflow</text>
    <text x="890" y="112">a workflow run</text>
  </g>
  <text x="40" y="112" class="hd">PATH</text>
  <text x="352" y="112" class="hd" text-anchor="middle">KIND</text>

  <!-- rows -->
  <g>
    <!-- helper rows drawn individually -->
    <!-- row 1 -->
    <rect x="40" y="124" width="920" height="44" fill="#faf9fe"/>
    <text x="56" y="151" class="t mono">/governance/governance.md</text>
    <text x="352" y="151" class="t xxs" text-anchor="middle" font-weight="600" fill="#6d5bd0">definition</text>
    <text x="470" y="152" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>
    <text x="610" y="152" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="750" y="152" font-size="16" text-anchor="middle" fill="#d99a2b">◐</text>
    <text x="890" y="152" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>

    <rect x="40" y="168" width="920" height="44" fill="#ffffff"/>
    <text x="56" y="195" class="t mono">/workflows/[governance].md  ×5</text>
    <text x="352" y="195" class="t xxs" text-anchor="middle" font-weight="600" fill="#6d5bd0">definition</text>
    <text x="470" y="196" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>
    <text x="610" y="196" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="750" y="196" font-size="16" text-anchor="middle" fill="#d99a2b">◐</text>
    <text x="890" y="196" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>

    <rect x="40" y="212" width="920" height="44" fill="#faf9fe"/>
    <text x="56" y="239" class="t mono">/workflows/[use-case].md</text>
    <text x="352" y="239" class="t xxs" text-anchor="middle" font-weight="600" fill="#6d5bd0">definition</text>
    <text x="470" y="240" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="610" y="240" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>
    <text x="750" y="240" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>
    <text x="890" y="240" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>

    <rect x="40" y="256" width="920" height="44" fill="#ffffff"/>
    <text x="56" y="283" class="t mono">/templates/*.html  *.md</text>
    <text x="352" y="283" class="t xxs" text-anchor="middle" font-weight="600" fill="#6d5bd0">definition</text>
    <text x="470" y="284" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>
    <text x="610" y="284" font-size="16" text-anchor="middle" fill="#d99a2b">◐</text>
    <text x="750" y="284" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="890" y="284" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>

    <rect x="40" y="300" width="920" height="44" fill="#faf9fe"/>
    <text x="56" y="327" class="t mono">/docs/user-guide.html</text>
    <text x="352" y="327" class="t xxs" text-anchor="middle" font-weight="600" fill="#6d5bd0">projection</text>
    <text x="470" y="328" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>
    <text x="610" y="328" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="750" y="328" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="890" y="328" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>

    <rect x="40" y="344" width="920" height="44" fill="#ffffff"/>
    <text x="56" y="371" class="t mono">/memory/*</text>
    <text x="352" y="371" class="t xxs" text-anchor="middle" font-weight="600" fill="#e2725b">data</text>
    <text x="470" y="372" font-size="16" text-anchor="middle" fill="#d99a2b">◐</text>
    <text x="610" y="372" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="750" y="372" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="890" y="372" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>

    <rect x="40" y="388" width="920" height="44" fill="#faf9fe"/>
    <text x="56" y="415" class="t mono">/logs/change-log.md</text>
    <text x="352" y="415" class="t xxs" text-anchor="middle" font-weight="600" fill="#e2725b">data</text>
    <text x="470" y="416" font-size="16" text-anchor="middle" fill="#d99a2b">◐</text>
    <text x="610" y="416" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>
    <text x="750" y="416" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>
    <text x="890" y="416" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>

    <rect x="40" y="432" width="920" height="44" fill="#ffffff"/>
    <text x="56" y="459" class="t mono">/logs/{decision,feedback}-log.md</text>
    <text x="352" y="459" class="t xxs" text-anchor="middle" font-weight="600" fill="#e2725b">data</text>
    <text x="470" y="460" font-size="16" text-anchor="middle" fill="#d99a2b">◐</text>
    <text x="610" y="460" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="750" y="460" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="890" y="460" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>

    <rect x="40" y="476" width="920" height="44" fill="#faf9fe"/>
    <text x="56" y="503" class="t mono">/outputs/[slug]-&lt;date&gt;.html</text>
    <text x="352" y="503" class="t xxs" text-anchor="middle" font-weight="600" fill="#e2725b">data</text>
    <text x="470" y="504" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="610" y="504" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="750" y="504" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="890" y="504" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>

    <rect x="40" y="520" width="920" height="44" fill="#ffffff"/>
    <text x="56" y="547" class="t mono">/inbox/**, /archive/**</text>
    <text x="352" y="547" class="t xxs" text-anchor="middle" font-weight="600" fill="#e2725b">data</text>
    <text x="470" y="548" font-size="16" text-anchor="middle" fill="#d99a2b">◐</text>
    <text x="610" y="548" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="750" y="548" font-size="16" text-anchor="middle" fill="#dde2ea">●</text>
    <text x="890" y="548" font-size="16" text-anchor="middle" fill="#2f9e5f">●</text>

  </g>
  <line x1="40" y1="118" x2="960" y2="118" stroke="#cfd6e0"/>
  <line x1="40" y1="564" x2="960" y2="564" stroke="#cfd6e0"/>

  <!-- maintainer-side paths -->
  <text x="40" y="586" class="hd">MAINTAINER-SIDE PATHS — NO SKILL AND NO WORKFLOW MAY WRITE HERE</text>

  <g>
    <rect x="40" y="596" width="920" height="44" fill="#faf9fe"/>
    <text x="56" y="623" class="t mono">claude-plugin/openaos/{content,workflow-specs}/</text>
    <text x="396" y="623" class="t xxs" font-weight="600" fill="#1a9c96">generated</text>
    <text x="540" y="623" class="m xxs">§36.2 only — byte-identical copies of design-spec/, asserted by CI</text>

    <rect x="40" y="640" width="920" height="52" fill="#ffffff"/>
    <text x="56" y="670" class="t mono">claude-plugin/openaos/skills/</text>
    <text x="396" y="662" class="t xxs" font-weight="600" fill="#6d5bd0">drafting surface</text>
    <text x="540" y="662" class="m xxs">§36.2 renders it — and a maintainer or contributor may hand-edit it</text>
    <text x="540" y="678" class="m xxs">directly; §36.3 reflects that edit into §8.1/§12/§13 (diagram I)</text>

    <rect x="40" y="692" width="920" height="52" fill="#faf9fe"/>
    <text x="56" y="722" class="t mono">design-spec/**</text>
    <text x="396" y="714" class="t xxs" font-weight="600" fill="#6d5bd0">source of truth</text>
    <text x="540" y="714" class="m xxs">a Proceed-gated spec edit, or §36.3 — one gate for the whole batch.</text>
    <text x="540" y="730" class="m xxs">sync-exclusions.md is appended by §36.3 and read by the §34 checklist</text>
  </g>
  <line x1="40" y1="744" x2="960" y2="744" stroke="#cfd6e0"/>

  <!-- legend -->
  <rect x="40" y="764" width="460" height="150" rx="6" fill="#f7f8fa" stroke="#cfd6e0"/>
  <text x="56" y="788" class="t s" font-weight="600">Legend</text>
  <text x="62" y="814" font-size="16" fill="#2f9e5f">●</text>
  <text x="86" y="814" class="m xs">writes freely, within its own gate</text>
  <text x="62" y="840" font-size="16" fill="#d99a2b">◐</text>
  <text x="86" y="840" class="m xs">restricted — see the notes at right</text>
  <text x="62" y="866" font-size="16" fill="#dde2ea">●</text>
  <text x="86" y="866" class="m xs">never writes here</text>
  <text x="56" y="888" class="m xxs">Setup writes almost everything, but exactly once.</text>
  <text x="56" y="904" class="m xxs">Build writes one workflow. Refine writes one workflow. Runs write only data.</text>

  <rect x="520" y="764" width="500" height="150" rx="6" fill="#fdf6e7" stroke="#d99a2b"/>
  <text x="536" y="786" class="t s" font-weight="600">The restrictions, spelled out</text>
  <text x="536" y="806" class="m xxs">· <tspan font-weight="600">setup on data files</tspan> — creates them once, empty or seeded.</text>
  <text x="546" y="820" class="m xxs">A re-run or plugin update never overwrites them.</text>
  <text x="536" y="840" class="m xxs">· <tspan font-weight="600">refine on governance</tspan> — may tune cadence, inputs, output shape,</text>
  <text x="546" y="854" class="m xxs">emphasis. May not delete a governance workflow, remove a gate,</text>
  <text x="546" y="868" class="m xxs">bypass the feedback scrub-preview-Proceed sequence, or weaken it.</text>
  <text x="536" y="888" class="m xxs">· <tspan font-weight="600">build on templates</tspan> — design-new mode also writes a report template.</text>
  <text x="536" y="904" class="m xxs">· <tspan font-weight="600">setup on change-log</tspan> — seeds it; later changes append, never rewrite.</text>

  <text x="40" y="932" class="m xs">Sync bookkeeping: sync-exclusions.md is tracked — it records design decisions. .openaos-sync-state.json is local, gitignored, and recomputable.</text>
</svg>
