<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t { fill: #1f2328; }
    .m { fill: #5b6472; }
    .h { font-size: 20px; font-weight: 600; }
    .s { font-size: 13px; }
    .xs { font-size: 11.5px; }
    .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; }
    .card { fill: #ffffff; stroke: #cfd6e0; stroke-width: 1; rx: 6; }
  </style>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="40" y="46" class="t h">A — The three-layer pipeline</text>
  <text x="40" y="70" class="m s">One direction only. Each layer is generated from the one above it, never edited in place from below.</text>

  <!-- Layer 1: design spec -->
  <rect x="40" y="96" width="920" height="150" rx="8" fill="#f4f2fd" stroke="#6d5bd0" stroke-width="2"/>
  <rect x="40" y="96" width="8" height="150" rx="4" fill="#6d5bd0"/>
  <text x="68" y="126" class="t" font-size="17" font-weight="600">1 · Design specification</text>
  <text x="68" y="147" class="m xs">design-spec/ — the source of truth. Human-authored; changed only through a Proceed-gated spec edit.</text>
  <rect x="68" y="160" width="200" height="66" class="card"/>
  <text x="82" y="182" class="t s" font-weight="600">Specification</text>
  <text x="82" y="200" class="m xs">openaos-design-</text>
  <text x="82" y="215" class="m xs">specification.md (§1–§28)</text>
  <rect x="284" y="160" width="200" height="66" class="card"/>
  <text x="298" y="182" class="t s" font-weight="600">Runbook</text>
  <text x="298" y="200" class="m xs">§33–§37 — the procedure</text>
  <text x="298" y="215" class="m xs">for generating the plugin</text>
  <rect x="500" y="160" width="200" height="66" class="card"/>
  <text x="514" y="182" class="t s" font-weight="600">Definition data</text>
  <text x="514" y="200" class="m xs">workflow-catalog.yaml,</text>
  <text x="514" y="215" class="m xs">vocabulary.yaml, skeletons</text>
  <rect x="716" y="160" width="228" height="66" class="card"/>
  <text x="730" y="182" class="t s" font-weight="600">Copy sources</text>
  <text x="730" y="200" class="m xs">content/, workflow-specs/ —</text>
  <text x="730" y="215" class="m xs">copied verbatim, not re-rendered</text>

  <!-- arrow 1 -->
  <line x1="500" y1="246" x2="500" y2="290" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="516" y="252" width="300" height="32" rx="4" fill="#fdf6e7" stroke="#d99a2b"/>
  <text x="530" y="272" class="t xs">§36.2 Plugin Generation — preview, then Proceed</text>

  <!-- Layer 2: plugin -->
  <rect x="40" y="298" width="920" height="150" rx="8" fill="#eefaf9" stroke="#1a9c96" stroke-width="2"/>
  <rect x="40" y="298" width="8" height="150" rx="4" fill="#1a9c96"/>
  <text x="68" y="328" class="t" font-size="17" font-weight="600">2 · The plugin</text>
  <text x="68" y="349" class="m xs">claude-plugin/openaos/ — generated, shipped identical to every user. Nobody edits this by hand.</text>
  <rect x="68" y="362" width="200" height="66" class="card"/>
  <text x="82" y="384" class="t s" font-weight="600">skills/</text>
  <text x="82" y="402" class="m xs">setup-openaos,</text>
  <text x="82" y="417" class="m xs">build-workflow, refine-workflow</text>
  <rect x="284" y="362" width="200" height="66" class="card"/>
  <text x="298" y="384" class="t s" font-weight="600">content/</text>
  <text x="298" y="402" class="m xs">governance.md, 5 governance</text>
  <text x="298" y="417" class="m xs">workflows, templates, root/</text>
  <rect x="500" y="362" width="200" height="66" class="card"/>
  <text x="514" y="384" class="t s" font-weight="600">workflow-specs/</text>
  <text x="514" y="402" class="m xs">the five builder specs</text>
  <text x="514" y="417" class="m xs">(one spec.md per use case)</text>
  <rect x="716" y="362" width="228" height="66" class="card"/>
  <text x="730" y="384" class="t s" font-weight="600">.claude-plugin/plugin.json</text>
  <text x="730" y="402" class="m xs">version == openaos_version</text>
  <text x="730" y="417" class="m xs">(§28.2)</text>

  <!-- arrow 2 -->
  <line x1="500" y1="448" x2="500" y2="492" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="516" y="454" width="300" height="32" rx="4" fill="#fdf6e7" stroke="#d99a2b"/>
  <text x="530" y="474" class="t xs">Install → setup-openaos scaffolds, on Proceed</text>

  <!-- Layer 3: instance -->
  <rect x="40" y="500" width="920" height="150" rx="8" fill="#fdf1ee" stroke="#e2725b" stroke-width="2"/>
  <rect x="40" y="500" width="8" height="150" rx="4" fill="#e2725b"/>
  <text x="68" y="530" class="t" font-size="17" font-weight="600">3 · The user's workspace</text>
  <text x="68" y="551" class="m xs">User-owned. Survives uninstall. Tailored by interview — nothing generic is ever scaffolded here.</text>
  <rect x="68" y="564" width="284" height="66" class="card"/>
  <text x="82" y="586" class="t s" font-weight="600">Rules and workflows</text>
  <text x="82" y="604" class="m xs">/governance, /workflows, /templates</text>
  <text x="82" y="619" class="m xs">definition files — change only via a gated path</text>
  <rect x="368" y="564" width="284" height="66" class="card"/>
  <text x="382" y="586" class="t s" font-weight="600">State and history</text>
  <text x="382" y="604" class="m xs">/memory, /logs</text>
  <text x="382" y="619" class="m xs">data files — accumulate, never overwritten</text>
  <rect x="668" y="564" width="276" height="66" class="card"/>
  <text x="682" y="586" class="t s" font-weight="600">Material and output</text>
  <text x="682" y="604" class="m xs">/inbox, /inbox/processed, /archive,</text>
  <text x="682" y="619" class="m xs">/outputs, /docs — also data files</text>

  <!-- version spine -->
  <rect x="40" y="666" width="920" height="36" rx="6" fill="#f7f8fa" stroke="#cfd6e0"/>
  <text x="56" y="689" class="t xs" font-weight="600">One version fact:</text>
  <text x="170" y="689" class="m xs">a single <tspan font-family="Consolas, monospace">openaos_version</tspan> is stamped through all three layers — spec frontmatter, plugin.json, and every generated workspace file.</text>
</svg>
