name: Validate Design Spec

on:
  pull_request:
    paths:
      - "design-spec/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "design-spec/**"
      - "scripts/**"

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate workflow catalog (schema + V1, V3, V4)
        run: python scripts/validate-workflow-catalog.py

  check-spec-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check openaos_version agreement across the design-spec set
        run: python scripts/check-spec-version.py
