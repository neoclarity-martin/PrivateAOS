# file-skeletons.yaml (design-time source artifact)
# SOURCE OF TRUTH for the ordered section / field skeletons that otherwise live
# only as markdown code blocks in the design-spec prose, plus the §17 governance
# workflows and the §20.1 required global memory files. Lives in design-spec/
# and is versioned with the spec. Each entry cites the section it renders; that
# section's prose carries the normative meaning, generation rules, and examples,
# and references this file for the enumerated skeleton.
#
# Cut to Minimal in Phase B: agent-era skeletons (agent instruction, registry,
# map, tool-access matrix, project brief, handoff summary, per-agent config)
# are removed with their spec sections. The governance-config skeleton was
# authored in Phase D; the user-guide skeleton follows in Phase G. In 3.1,
# the status_report skeleton is retired and replaced by seven html_report
# entries (§18.2) sharing the §18.1 canonical CSS; governance_config gains
# the Workflows/Logs sections (renamed from Memory Boundaries -> Memory). In
# 3.2, the workflow skeleton drops `When to Use`; workflow_router (§16.11)
# takes over trigger authority.
#
# Scope note: the three interaction templates (§18.3 decision-entry, §18.5
# approval-request, §18.6 memory-entry) embed another schema for their
# `## Template` block (§16.5 / §18.5 fields / §16.2 respectively) but are
# themselves §16.4 template files, so each now carries an explicit skeleton
# entry below for §18.7 validation; the embedded block stays defined by the
# section it comes from.
openaos_version: 3.2.0

# ---------------------------------------------------------------------------
# File skeletons — ordered section lists and entry-field lists
# ---------------------------------------------------------------------------
# Each entry has `id`, `spec`, and at least one of: `sections` (ordered `##`
# headings) or `entry_fields` (ordered labels for a dated/append entry block).
# `file_type` (when present) must exist in vocabulary.yaml `file_type`.
file_skeletons:
  - id: memory
    spec: "§16.2"
    file_type: memory
    sections:
      - Purpose
      - Scope
      - What Belongs Here
      - What Does Not Belong Here
      - Memory Entries
      - Review / Cleanup Notes
    # dated block under `## Memory Entries` — the seven §20.3 fields (§18.6)
    entry_fields: [Type, Summary, Source, Confidence, Owner, Review Date, Notes]

  - id: workflow
    spec: "§16.3"
    file_type: workflow
    sections:
      - Purpose
      - Inputs
      - Outputs
      - Steps
      - Decision Points
      - Approval Gates
      - Escalation Triggers
      - Completion Criteria

  - id: template
    spec: "§16.4"
    file_type: template
    sections:
      - Purpose
      - When to Use
      - Template
      - Completion Checklist
      - Notes

  - id: decision_log
    spec: "§16.5"
    file_type: decision_log
    sections:
      - Log Rules
      - Entries
    entry_fields: [Decision, Context, Reasoning, Approved By, Impacted Files, Follow-Up Needed]

  - id: feedback_log
    spec: "§16.7"
    file_type: feedback_log
    sections:
      - Log Rules
      - Entries
    entry_fields: [Type, Status, Scrub, Summary, Sent]

  - id: change_log
    spec: "§16.8"
    file_type: change_log
    # §16.8 defines an entry schema only; the file has no fixed section skeleton.
    entry_fields: [Change, Made By, Files Affected]

  # HTML report templates (§18.2) — retire status_report (2.x
  # status-report-template.md); each entry's `sections` is its ordered
  # `<section class="card ...">` <h2> list, which the workflow's Outputs
  # section must match exactly. All seven embed the §18.1 canonical CSS
  # verbatim (id: canonical_report_css, below).
  - id: canonical_report_css
    spec: "§18.1"
    applies_to: "embedded <style> block in every html_report_* template"

  - id: html_report_daily_startup
    spec: "§18.2"
    file_type: template
    applies_to: /templates/daily-startup-report-template.html
    sections: [Items processed, Items still unresolved, Where items were promoted, Items requiring user approval, What matters today, Completion]

  - id: html_report_end_of_day
    spec: "§18.2"
    file_type: template
    applies_to: /templates/end-of-day-carryover-template.html
    sections: [Decisions logged today, Open obligations, Proposed memory entries, Follow-ups needed, Carryover for tomorrow]

  - id: html_report_weekly_review
    spec: "§18.2"
    file_type: template
    applies_to: /templates/weekly-review-report-template.html
    sections: [At-risk commitments, Follow-up list for next week, Stale memory flags, Workflow performance notes, Next-week priorities]

  - id: html_report_monthly_review
    spec: "§18.2"
    file_type: template
    applies_to: /templates/monthly-review-report-template.html
    sections: [Memory hygiene, Permission boundary review, Structural pass, Goal alignment, Feedback candidates, User guide regeneration]

  - id: html_report_inbox_triage
    spec: "§18.2"
    file_type: template
    applies_to: /templates/inbox-triage-report-template.html
    sections: [Category breakdown, Items processed, Items still unresolved, Where items were promoted, Items requiring user approval]

  - id: html_report_organizer
    spec: "§18.2"
    file_type: template
    applies_to: /templates/organizer-report-template.html
    sections: [Survey summary, Proposed move plan, Duplicates found, Executed moves, Review folder, Verification]

  - id: html_report_learning_assistant
    spec: "§18.2"
    file_type: template
    applies_to: /templates/learning-assistant-report-template.html
    sections: [Session recap, What was covered, Understanding checks, Practice, Next-session plan, Progress snapshot]

  - id: governance_config
    spec: "§16.1"
    file_type: config
    applies_to: /governance/governance.md
    content_source: design-spec/content/governance/governance.md
    # §18.7: literal markers that must appear inside the named section — the
    # permission model's three levels are bold leads, not `###` headings.
    required_markers:
      Permission Model:
        - "**Level 1"
        - "**Level 2"
        - "**Level 3"
      Local Rules:
        - Output reports render as HTML
    sections:
      - Purpose
      - The Proceed Gate
      - Permission Model
      - Memory
      - Workflows
      - Logs
      - Escalation to the User
      - Local Rules
      - Change Notes
    # dated block under `## Change Notes`
    entry_fields: [Change]

  - id: workflow_router
    spec: "§16.11"
    file_type: router
    applies_to: /governance/workflow-router.md
    content_source: design-spec/content/governance/workflow-router.md
    # §18.7: the routing table itself must be present and carry its header row
    required_markers:
      Routes:
        - "| Example Prompts | File to Load |"
    sections:
      - Purpose
      - Routes

  - id: workflow_spec
    spec: "§7B.1"
    file_type: workflow_spec
    applies_to: design-spec/workflow-specs/[slug]/spec.md
    sections:
      - Purpose
      - Situation Interview
      - Baked-In Best Practices
      - Default Skeleton
      - Notes

  # Interaction templates (§18.3, §18.5, §18.6) — §16.4 template files whose
  # `## Template` block embeds another schema. Validated by §18.7.
  - id: approval_request
    spec: "§18.5"
    file_type: template
    applies_to: /templates/approval-request-template.md
    content_source: design-spec/content/templates/approval-request-template.md
    sections: [Purpose, When to Use, Template, Completion Checklist, Notes]
    # the five §3.1 elements as labeled fields, inside `## Template`
    entry_fields: [Proposed Action, Affected Files, Reason, Consequence, Approval]

  - id: decision_entry
    spec: "§18.3"
    file_type: template
    applies_to: /templates/decision-entry-template.md
    content_source: design-spec/content/templates/decision-entry-template.md
    sections: [Purpose, When to Use, Template, Completion Checklist, Notes]
    # `## Template` embeds the §16.5 dated decision-log entry block
    entry_fields: [Decision, Context, Reasoning, Approved By, Impacted Files, Follow-Up Needed]

  - id: memory_entry
    spec: "§18.6"
    file_type: template
    applies_to: /templates/memory-entry-template.md
    content_source: design-spec/content/templates/memory-entry-template.md
    sections: [Purpose, When to Use, Template, Completion Checklist, Notes]
    # `## Template` embeds the §16.2 dated memory entry block (seven §20.3 fields)
    entry_fields: [Type, Summary, Source, Confidence, Owner, Review Date, Notes]

  - id: user_guide
    spec: "§16.6"
    file_type: template
    applies_to: /templates/user-guide-template.html
    content_source: design-spec/content/templates/user-guide-template.html
    # ordered <h2> list of the generated guide (§16.6 content sections)
    sections: [What openaos Is, Your Workflows, Building a Workflow, Refining a Workflow, The Proceed Gate and Safety Model, Governance Rhythms, Memory and What Gets Remembered, Sending Feedback, Change Log]

# ---------------------------------------------------------------------------
# Workspace-root scaffolds (§16.10) — not §16.4 template files: they open with
# an HTML comment and carry pointers, so they have no frontmatter and no `##`
# skeleton. §18.7 checks only that these required anchors are present.
# ---------------------------------------------------------------------------
root_scaffold:
  - id: root_claude_md
    spec: "§16.10"
    content_source: design-spec/content/root/CLAUDE.md
    ships_to: /CLAUDE.md
    required_anchors:
      - openaos
      - "@AGENTS.md"

  - id: root_agents_md
    spec: "§16.10"
    content_source: design-spec/content/root/AGENTS.md
    ships_to: /AGENTS.md
    required_anchors:
      - Proceed
      - governance
      - refine-workflow
      - "@governance/workflow-router.md"

# ---------------------------------------------------------------------------
# Governance workflows (§17) — enumerable fields only (paths, purposes, review
# questions, brief categories); the normative definitions are §17.1–§17.5 prose.
# ---------------------------------------------------------------------------
workflows:
  - id: daily-startup
    spec: "§17.1"
    path: /workflows/daily-startup.md
    purpose: >-
      Help the user start the day by reviewing priorities, commitments, inbox
      items, and recently processed inbox items.
    review_questions: ["What matters today?"]
    # startup-brief skeleton (§31)
    brief_categories:
      - Items processed
      - Items still unresolved
      - Where items were promoted to
      - Items requiring user approval

  - id: end-of-day
    spec: "§17.2"
    path: /workflows/end-of-day.md
    purpose: >-
      Capture what changed today, what must not be lost, unresolved
      obligations, decisions made, follow-ups needed, and next-day carryover.
    review_questions: ["What changed today, and what must not be lost?"]

  - id: weekly-review
    spec: "§17.3"
    path: /workflows/weekly-review.md
    purpose: >-
      Review commitments, decisions, unresolved items, workflow performance,
      stale memory signals, and next-week priorities.
    review_questions: ["What needs follow-up soon?"]

  - id: monthly-review
    spec: "§17.4"
    path: /workflows/monthly-review.md
    purpose: >-
      Review memory hygiene, workflow quality, permission boundaries,
      structural clutter, and system cleanup needs; and review whether the
      system is still aimed at the right goals and whether workflows still
      support the user's priorities.
    review_questions:
      - "What is stale, misplaced, or structurally messy?"
      - "Is the whole system still aimed at the right goals?"

  - id: feedback
    spec: "§17.5"
    path: /workflows/feedback.md
    purpose: >-
      Capture feedback for the project team, scrub names, file content, and
      memory quotes, preview, and send only on Proceed; stage offline in
      /logs/feedback-log.md.

# ---------------------------------------------------------------------------
# Required global memory files (§20.1)
# ---------------------------------------------------------------------------
global_memory_files:
  - /memory/user-profile.md
  - /memory/preferences.md
  - /memory/people.md
  - /memory/decisions.md
